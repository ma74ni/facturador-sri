services:
  - type: web
    name: facturador-api-staging
    runtime: node
    region: oregon
    plan: free
    branch: dev
    rootDir: packages/facturacion-core
    buildCommand: cd ../.. && corepack enable && corepack prepare pnpm@10.19.0 --activate && pnpm install --frozen-lockfile && pnpm --filter facturacion-core prisma:generate && pnpm --filter facturacion-core build
    startCommand: ./render-start.sh
