[build]
  # Directorio base del frontend
  base = "packages/web-facturacion"

  # Comando de build: instala el workspace y compila el frontend
  command = "cd ../.. && pnpm install && pnpm --filter web-facturacion build"

  # Directorio de publicación (relativo al base)
  publish = ".next"

[build.environment]
  # Node 20 LTS (Next 15 necesita >= 18.18; Node 18 ya no tiene soporte)
  NODE_VERSION = "20"

  # Habilitar pnpm
  NPM_FLAGS = "--version"

# API por ambiente (se hornea en el build). Producción: rama main en
# app.facturador.siete8.com. Staging: branch deploy de la rama dev.
[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://api.facturador.siete8.com/api/v1"

[context.branch-deploy.environment]
  NEXT_PUBLIC_API_URL = "https://facturador-core-dev.onrender.com/api/v1"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "https://facturador-core-dev.onrender.com/api/v1"

# Configuración de redirecciones para Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
